name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak project
        run: unzip -q "$(ls *.zip | head -n 1)"

      - name: Build APK
        working-directory: gamespace
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SionGameSpace-APK
          path: gamespace/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
